name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Bun 1.4.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun ci

      - name: Audit
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Validate committed content
        run: bun run validate

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: HTTP smoke test
        run: bun run smoke:http

      - name: OAuth smoke test (local JWKS)
        run: bun run smoke:oauth:local

  binaries:
    name: Standalone binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun ci

      - name: Build binary
        run: bun run build:binaries

      - name: Smoke binary
        run: bun run smoke:binary

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun ci

      - name: Coverage
        run: bun run test:coverage

  docker-audit:
    name: Docker audit image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build audit image
        run: docker build -f Dockerfile.audit -t tastepro:audit .

      - name: Run audit image
        run: |
          docker run -d --name tastepro-audit-ci \
            -p 127.0.0.1:3000:3000 \
            -e TASTEPRO_API_KEY=ci-token \
            -e TASTEPRO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            --shm-size=1g \
            tastepro:audit
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz | jq -e '.status == "ok"'
          test "$(docker inspect -f '{{.Config.User}}' tastepro-audit-ci)" = "node"

      - name: Audit image logs
        if: always()
        run: docker logs tastepro-audit-ci || true

      - name: Remove audit container
        if: always()
        run: docker rm -f tastepro-audit-ci || true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tastepro:ci .

      - name: Run container
        run: |
          docker run -d --name tastepro-ci \
            -p 127.0.0.1:3000:3000 \
            -e TASTEPRO_API_KEY=ci-token \
            -e TASTEPRO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            tastepro:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/healthz \
            | jq -e '.status == "ok" and .catalogEntries == 873'

          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          test "$status" = "401"

          test "$(docker inspect -f '{{.Config.User}}' tastepro-ci)" = "bun"

      - name: Container logs
        if: always()
        run: docker logs tastepro-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f tastepro-ci || true
