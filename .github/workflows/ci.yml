name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate committed content
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: HTTP smoke test
        run: npm run smoke:http

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tastepro:ci .

      - name: Run container
        run: |
          docker run -d --name tastepro-ci \
            -p 127.0.0.1:3000:3000 \
            -e TASTEPRO_API_KEY=ci-token \
            tastepro:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/healthz \
            | jq -e '.status == "ok" and .catalogEntries == 873'

          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/mcp \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          test "$status" = "401"

          test "$(docker inspect -f '{{.Config.User}}' tastepro-ci)" = "node"

      - name: Container logs
        if: always()
        run: docker logs tastepro-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f tastepro-ci || true
