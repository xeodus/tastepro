name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun ci

      - name: Tag matches package version
        run: test "v$(jq -r .version package.json)" = "${GITHUB_REF_NAME}"

      - name: Audit
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Validate content
        run: bun run validate

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: HTTP smoke
        run: bun run smoke:http

      - name: OAuth smoke (local JWKS)
        run: bun run smoke:oauth:local

      - name: Package contents
        run: npm pack --dry-run

  oauth:
    name: Keycloak E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun ci

      - name: Start Keycloak
        run: docker compose -f deploy/keycloak.compose.yml up -d

      - name: OAuth smoke
        run: bun run smoke:oauth

      - name: Stop Keycloak
        if: always()
        run: docker compose -f deploy/keycloak.compose.yml down -v

  binaries:
    name: Publish binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify, oauth]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun ci

      - name: Build all targets
        run: bun run build:binaries:all

      - name: Smoke the Linux binary
        run: TASTEPRO_BINARY=dist-bin/tastepro-linux-x64 bun run smoke:binary

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Checksums and signature
        run: |
          cd dist-bin
          sha256sum tastepro-* > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.bundle SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TastePro ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-bin/*

  image:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify, oauth]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes "${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  audit-image:
    name: Publish audit image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [verify, oauth]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}-audit
            type=sha,suffix=-audit

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.audit
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes "${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, oauth]
    if: vars.NPM_PUBLISH == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: bun ci

      - name: Build
        run: bun run build

      # Trusted publishing: configure this repository as a trusted publisher
      # for `tastepro` on npmjs.com and allow the `npm publish` action, then set
      # the repository variable NPM_PUBLISH=true. No long-lived token is stored.
      #
      # First publish only: if npm requires the package to exist before a
      # trusted publisher can be configured, set the NPM_TOKEN secret instead.
      # The token is used once and can be revoked afterwards.
      - name: Publish with provenance
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
          fi
          npm publish --provenance --access public --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  registry:
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [npm, image]
    if: vars.MCP_REGISTRY_PUBLISH == 'true'
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: mcp-publisher validate

      # The registry checks the exact npm version. A fresh publish can take a
      # few seconds to appear, so wait instead of racing it.
      - name: Wait for npm propagation
        run: |
          set -euo pipefail
          version="$(jq -r .version server.json)"
          for _ in $(seq 1 60); do
            if curl -fsS "https://registry.npmjs.org/tastepro/${version}" >/dev/null 2>&1; then
              echo "tastepro@${version} is visible on npm"
              exit 0
            fi
            sleep 10
          done
          echo "timed out waiting for tastepro@${version} on npm" >&2
          exit 1

      - name: Authenticate with GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
