name: tastepro-staging

# Staging scaffold: TastePro behind Caddy with automatic HTTPS.
#
#   cp deploy/staging.env.example deploy/staging.env
#   # edit domain and auth settings
#   docker compose --env-file deploy/staging.env \
#     -f deploy/staging.compose.yml up -d --build
#
# Caddy needs ports 80 and 443 (TCP and UDP) reachable for ACME. The TastePro
# service is not published; it is reachable only on the internal network.

services:
  tastepro:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tastepro:staging
    restart: unless-stopped
    init: true
    environment:
      TASTEPRO_HOST: 0.0.0.0
      TASTEPRO_PORT: "3000"
      # Leave empty for an intentionally anonymous read-only endpoint.
      # Anonymous non-loopback binds also require TASTEPRO_ALLOW_ANONYMOUS=true.
      # Set a strong token for authenticated clients.
      TASTEPRO_API_KEY: ${TASTEPRO_API_KEY:-}
      TASTEPRO_ALLOW_ANONYMOUS: ${TASTEPRO_ALLOW_ANONYMOUS:-false}
      # OAuth resource-server auth, exclusive with TASTEPRO_API_KEY.
      TASTEPRO_OAUTH_ISSUER: ${TASTEPRO_OAUTH_ISSUER:-}
      TASTEPRO_OAUTH_JWKS_URI: ${TASTEPRO_OAUTH_JWKS_URI:-}
      # Derived from the public domain; required when OAuth is configured.
      TASTEPRO_PUBLIC_URL: https://${TASTEPRO_DOMAIN:?TASTEPRO_DOMAIN is required}
      # taste_audit; URL input and browser rendering stay off by default.
      TASTEPRO_AUDIT_ENABLED: ${TASTEPRO_AUDIT_ENABLED:-true}
      TASTEPRO_AUDIT_ALLOW_URL_FETCH: ${TASTEPRO_AUDIT_ALLOW_URL_FETCH:-false}
      TASTEPRO_AUDIT_BROWSER: ${TASTEPRO_AUDIT_BROWSER:-}
      TASTEPRO_CORS_ORIGIN: ${TASTEPRO_CORS_ORIGIN:-https://chatgpt.com}
      # The public domain plus loopback names used by the container
      # healthcheck. Host matching strips the port.
      TASTEPRO_ALLOWED_HOSTS: ${TASTEPRO_DOMAIN:?TASTEPRO_DOMAIN is required},localhost,127.0.0.1
      TASTEPRO_LOG_LEVEL: ${TASTEPRO_LOG_LEVEL:-info}
    expose:
      - "3000"
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      tastepro:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TASTEPRO_DOMAIN: ${TASTEPRO_DOMAIN:?TASTEPRO_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
