name: tastepro-production

# Production-shaped self-host deployment: Caddy terminates TLS, TastePro runs
# stateless behind it, and OAuth is required.
#
#   cp deploy/production.env.example deploy/production.env
#   # edit domain, image, and IdP settings
#   docker compose --env-file deploy/production.env \
#     -f deploy/production.compose.yml up -d
#
# This file does not rate limit by itself. Put a WAF, CDN, or a rate-limiting
# proxy in front, or replace the stock Caddy image with one that includes a
# rate-limit plugin.

services:
  tastepro:
    image: ${TASTEPRO_IMAGE:?Set TASTEPRO_IMAGE to the published image, e.g. ghcr.io/org/tastepro:1.0.0}
    restart: unless-stopped
    init: true
    environment:
      TASTEPRO_HOST: 0.0.0.0
      TASTEPRO_PORT: "3000"
      TASTEPRO_PUBLIC_URL: https://${TASTEPRO_DOMAIN:?TASTEPRO_DOMAIN is required}
      TASTEPRO_ALLOWED_HOSTS: ${TASTEPRO_DOMAIN:?TASTEPRO_DOMAIN is required},localhost,127.0.0.1
      TASTEPRO_OAUTH_ISSUER: ${TASTEPRO_OAUTH_ISSUER:?TASTEPRO_OAUTH_ISSUER is required}
      TASTEPRO_OAUTH_AUDIENCE: ${TASTEPRO_OAUTH_AUDIENCE:-}
      TASTEPRO_OAUTH_JWKS_URI: ${TASTEPRO_OAUTH_JWKS_URI:-}
      TASTEPRO_HTTP_MODE: stateless
      TASTEPRO_CORS_ORIGIN: ${TASTEPRO_CORS_ORIGIN:-}
      TASTEPRO_AUDIT_ENABLED: ${TASTEPRO_AUDIT_ENABLED:-true}
      TASTEPRO_AUDIT_ALLOW_URL_FETCH: ${TASTEPRO_AUDIT_ALLOW_URL_FETCH:-false}
      TASTEPRO_AUDIT_MAX_CONCURRENCY: ${TASTEPRO_AUDIT_MAX_CONCURRENCY:-2}
      TASTEPRO_AUDIT_MAX_QUEUE: ${TASTEPRO_AUDIT_MAX_QUEUE:-8}
      TASTEPRO_LOG_LEVEL: ${TASTEPRO_LOG_LEVEL:-info}
    expose:
      - "3000"
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - tastepro
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TASTEPRO_DOMAIN: ${TASTEPRO_DOMAIN:?TASTEPRO_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
